name: CI/CD Pipeline

# Quality-gated pipeline:
#
#   PR opened/updated:    validate → preview_deploy → e2e_preview
#                         (merge blocked until all three pass)
#
#   push to main:         validate → prod_deploy → e2e_prod
#                         (no deploy unless validate is green;
#                          prod is alarmed by the post-deploy E2E)
#
#   workflow_dispatch:    validate → prod_deploy → e2e_prod
#                         (deploys whatever ref is selected from the
#                          GitHub UI; same gates as push-to-main)
#
# Quality gates run in `validate`:
#   - prettier --check (frontend src/**)
#   - eslint .
#   - npm audit --omit=dev --audit-level=high (frontend prod deps)
#   - npm audit --audit-level=moderate (api, all deps)
#   - frontend unit + SWA-config-invariant tests (vitest)
#   - api unit tests (vitest)
#   - frontend build (astro)
#   - api build (tsc)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Stage 1 — Validate. All quality gates. Must pass before any deploy.
  # Runs on every event (PRs, push-to-main, workflow_dispatch).
  # ─────────────────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    name: Validate (lint, audit, tests, build)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Security audit (frontend prod deps, high+)
        run: npm run audit

      - name: Frontend tests (vitest, includes SWA config invariants)
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Install API deps
        working-directory: api
        run: npm ci --include=dev

      - name: Security audit (api, moderate+)
        working-directory: api
        run: npm audit --audit-level=moderate

      - name: API tests (vitest)
        working-directory: api
        run: npm test

      - name: Build API
        working-directory: api
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2a — PR preview deploy. SWA per-PR preview environment.
  # Only runs on PRs and only after validate is green.
  # ─────────────────────────────────────────────────────────────────────
  preview_deploy:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy PR preview
    outputs:
      preview_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (preview)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          api_build_command: "npm ci --include=dev && npm test && npm run build"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2b — E2E against PR preview. Gates merge.
  # Diagnostic curl step always prints the redirect chain so a failure
  # is self-diagnosing without re-running.
  # ─────────────────────────────────────────────────────────────────────
  e2e_preview:
    if: github.event_name == 'pull_request'
    needs: preview_deploy
    runs-on: ubuntu-latest
    name: E2E (PR preview)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Wait for SWA propagation
        run: sleep 60
      - name: Diagnostic — auth login redirect chain
        env:
          E2E_BASE_URL: ${{ needs.preview_deploy.outputs.preview_url }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::error::SWA action did not return a preview URL — cannot run E2E"
            exit 1
          fi
          echo "::group::HEAD $E2E_BASE_URL/.auth/login/github (3 hops)"
          curl -sIL --max-redirs 3 -o /dev/null -w "url_effective=%{url_effective}\nhttp_code=%{http_code}\nredirect_url=%{redirect_url}\n" "$E2E_BASE_URL/.auth/login/github" || true
          echo "::endgroup::"
          echo "::group::Single-hop Location header"
          curl -sI "$E2E_BASE_URL/.auth/login/github" | grep -i '^location:' || echo "(no Location header)"
          echo "::endgroup::"
      - name: Run E2E suite against preview
        env:
          E2E_BASE_URL: ${{ needs.preview_deploy.outputs.preview_url }}
        run: npm run test:e2e

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3a — Production deploy. Only after validate is green.
  # Triggered by push-to-main or workflow_dispatch.
  # ─────────────────────────────────────────────────────────────────────
  prod_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy production
    environment:
      name: production
      url: https://codepals.io
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (production)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          api_build_command: "npm ci --include=dev && npm test && npm run build"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3b — Post-deploy E2E against production. Alarms on regression.
  # ─────────────────────────────────────────────────────────────────────
  e2e_prod:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: prod_deploy
    runs-on: ubuntu-latest
    name: E2E (production)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Wait for SWA propagation
        run: sleep 60
      - name: Diagnostic — auth login redirect chain
        run: |
          echo "::group::HEAD https://codepals.io/.auth/login/github (3 hops)"
          curl -sIL --max-redirs 3 -o /dev/null -w "url_effective=%{url_effective}\nhttp_code=%{http_code}\nredirect_url=%{redirect_url}\n" "https://codepals.io/.auth/login/github" || true
          echo "::endgroup::"
          echo "::group::Single-hop Location header"
          curl -sI "https://codepals.io/.auth/login/github" | grep -i '^location:' || echo "(no Location header)"
          echo "::endgroup::"
      - name: Run E2E suite against production
        env:
          E2E_BASE_URL: https://codepals.io
          # Production has GitHub OAuth secrets configured; require the
          # full auth-flow chain to reach GitHub. Preview envs leave this
          # unset and the test soft-skips when SWA auth-loop is detected.
          E2E_AUTH_REQUIRED: '1'
        run: npm run test:e2e
