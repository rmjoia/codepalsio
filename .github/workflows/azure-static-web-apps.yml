name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    # Run validation only on PRs — no SWA deploy. Just build + tests.
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    # Manually deploy any branch to dev.codepals.io. Pick the branch from
    # the GitHub UI's "Run workflow" dropdown; checkout uses that ref.

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # PR validation: build everything, run all tests, no deploy.
  # No SWA action, no preview environment, no minutes wasted on a URL
  # nobody uses.
  # ─────────────────────────────────────────────────────────────────────
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: CI (build + tests)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run frontend tests
        run: npm run test:run

      - name: Install API deps
        working-directory: api
        run: npm ci --include=dev

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Run API tests
        working-directory: api
        run: npm test

  # ─────────────────────────────────────────────────────────────────────
  # Deploy: triggered by push-to-main OR manual workflow_dispatch.
  # Manual dispatch from any branch lands that branch on dev.codepals.io.
  # ─────────────────────────────────────────────────────────────────────
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          api_build_command: "npm ci --include=dev && npm test && npm run build"

  # ─────────────────────────────────────────────────────────────────────
  # Post-deploy E2E: hits the live SWA to assert /.auth/login/github,
  # role gating, etc. actually work end-to-end. Catches deploy-time
  # regressions the config-invariant tests can't see (missing app
  # settings, propagation lag, OAuth callback mismatch).
  # ─────────────────────────────────────────────────────────────────────
  e2e_post_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: Post-deploy E2E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Resolve E2E base URL
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "url=https://codepals.io" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://dev.codepals.io" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for SWA propagation
        run: sleep 60
      - name: Run E2E suite
        env:
          E2E_BASE_URL: ${{ steps.resolve.outputs.url }}
        run: npm run test:e2e
