name: CI/CD Pipeline

# Quality-gated pipeline for the DEV tier (dev.codepals.io).
#
# One environment, one deploy target — the dev SWA's *Production*
# environment (which serves dev.codepals.io). No per-PR preview
# environments: those count toward the SWA Free tier's 3-env cap and
# accumulate across PRs, blocking the cost-saving downgrade to Free.
#
# Trigger model:
#   push to any branch:    validate → dev_deploy → e2e_dev
#                          (E2E against dev.codepals.io with
#                          E2E_AUTH_REQUIRED=1)
#   workflow_dispatch:     same as above, manual trigger
#
# Trade-off: with no per-PR isolation, two pushes (different branches)
# in flight will race — last-pushed wins on dev. Acceptable for solo /
# low-traffic dev work; revisit if/when collaborators come on board.
#
# Branch protection: configure 'Validate (lint, audit, tests, build)'
# and 'E2E (dev.codepals.io)' as required checks on main. The PR's
# head commit's status (from the push event) gates the merge.
#
# This pipeline DOES NOT touch production (codepals.io). The prod tier
# is a separate Azure SWA resource with its own deploy token; promotion
# from dev → prod is intentionally manual and out of scope here. When
# we're ready to go live, add a parallel prod_deploy + e2e_prod chain
# (likely tag-triggered or release-triggered, gated on a `production`
# GitHub Environment with required reviewers, using a separate
# `AZURE_STATIC_WEB_APPS_PROD_API_TOKEN` secret).
#
# Quality gates run in `validate` (CI). dev_deploy needs: validate, so
# a failure in ANY gate below blocks the deploy (CD). Mark 'Validate'
# a required status check on main so the same gate also blocks merge.
#   - prettier --check (frontend src/**)
#   - eslint .
#   - npm audit --omit=dev --audit-level=high (frontend prod deps)   ← dependency/security
#   - npm audit --audit-level=moderate (api, all deps)               ← dependency/security
#   - frontend unit + SWA-config-invariant tests (vitest)            ← unit
#   - api unit tests (vitest)                                        ← unit
#   - frontend build (astro)
#   - browser E2E (Playwright, hermetic — mocked API)                ← e2e
#   - api build (tsc)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands. Cross-
# branch races still hit the same dev env (last-pushed-wins); per-ref
# cancel just avoids wasting a deploy slot on a stale commit of the
# same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Stage 1 — Validate. All quality gates. Must pass before deploy.
  # ─────────────────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    name: Validate (lint, audit, tests, build)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Security audit (frontend prod deps, high+)
        run: npm run audit

      - name: Frontend tests (vitest, includes SWA config invariants)
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      # Hermetic browser E2E (Playwright). Runs against the static build
      # via `astro preview`, mocking /api/* + /.auth/me — no deploy, no
      # Cosmos, no real OAuth. Gates the deploy (dev_deploy needs:
      # validate), so a broken visibility/auth render blocks CD. Browser
      # binary is installed with --with-deps for the CI runner's missing
      # system libs.
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (Playwright, hermetic)
        run: npm run test:e2e:browser

      - name: Install API deps
        working-directory: api
        run: npm ci --include=dev

      - name: Security audit (api, moderate+)
        working-directory: api
        run: npm audit --audit-level=moderate

      - name: API tests (vitest)
        working-directory: api
        run: npm test

      - name: Build API
        working-directory: api
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2 — Deploy to the dev SWA's Production environment
  # (dev.codepals.io). Runs on every push that passes validate.
  # No per-PR preview environments — we deliberately overwrite the dev
  # env on each push so we stay within the SWA Free tier's 3-env cap.
  # ─────────────────────────────────────────────────────────────────────
  dev_deploy:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy dev (dev.codepals.io)
    environment:
      name: dev
      url: https://dev.codepals.io
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (dev SWA production env)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # AZURE_STATIC_WEB_APPS_API_TOKEN is the DEV SWA's deploy token.
          # The action targets the Production environment of that SWA on
          # `push` events. We don't trigger on `pull_request` (which would
          # auto-create a per-PR preview env regardless of action inputs).
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          api_build_command: "npm ci --include=dev && npm test && npm run build"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3 — Post-deploy E2E against dev.codepals.io. Alarms on
  # regression. Strict mode (E2E_AUTH_REQUIRED=1) — dev has GitHub OAuth
  # configured, so the full auth-flow chain must reach GitHub.
  # ─────────────────────────────────────────────────────────────────────
  e2e_dev:
    needs: dev_deploy
    runs-on: ubuntu-latest
    name: E2E (dev.codepals.io)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Wait for SWA readiness (poll homepage until 200, max 5min)
        run: |
          deadline=$(($(date +%s) + 300))
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            code=$(curl -sLo /dev/null -w "%{http_code}" --max-time 10 https://dev.codepals.io/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://dev.codepals.io/ ready (200) after $attempts attempt(s)"
              break
            fi
            now=$(date +%s)
            if [ "$now" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for https://dev.codepals.io/ (last code: $code)"
              exit 1
            fi
            echo "  attempt $attempts: $code, retrying in 5s..."
            sleep 5
          done
      - name: Diagnostic — auth login redirect chain
        run: |
          echo "::group::HEAD https://dev.codepals.io/.auth/login/github (3 hops)"
          curl -sIL --max-redirs 3 -o /dev/null -w "url_effective=%{url_effective}\nhttp_code=%{http_code}\nredirect_url=%{redirect_url}\n" "https://dev.codepals.io/.auth/login/github" || true
          echo "::endgroup::"
          echo "::group::Single-hop Location header"
          curl -sI "https://dev.codepals.io/.auth/login/github" | grep -i '^location:' || echo "(no Location header)"
          echo "::endgroup::"
      - name: Run E2E suite against dev (with retry)
        env:
          E2E_BASE_URL: https://dev.codepals.io
          E2E_AUTH_REQUIRED: '1'
        run: |
          # Up to 3 attempts, 30s between. Catches transient cold-start /
          # network blips without hiding real regressions (3 consecutive
          # failures still fail the job and red-flag the deploy).
          for attempt in 1 2 3; do
            echo "::group::E2E attempt $attempt/3"
            if npm run test:e2e; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "E2E attempt $attempt failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "::error::E2E failed against dev.codepals.io after 3 attempts"
          exit 1
