name: CI/CD Pipeline

# Quality-gated pipeline for the DEV tier (dev.codepals.io).
#
#   PR opened/updated:    validate → preview_dev_deploy → e2e_preview_dev
#                         (merge blocked until all three pass; deploys
#                          to a per-PR preview env on the dev SWA)
#
#   push to main:         validate → dev_deploy → e2e_dev
#                         (no deploy unless validate is green; targets
#                          the dev SWA's production env which serves
#                          dev.codepals.io)
#
#   workflow_dispatch:    validate → dev_deploy → e2e_dev
#                         (deploys whatever ref is selected from the
#                          GitHub UI; same gates as push-to-main)
#
# This pipeline DOES NOT touch production (codepals.io). The prod tier
# is a separate Azure SWA resource with its own deploy token; promotion
# from dev → prod is intentionally manual and out of scope here. When
# we're ready to go live, add a parallel `preview_prod_deploy` +
# `prod_deploy` + `e2e_prod` chain (likely tag-triggered or
# release-triggered, gated on a `production` GitHub Environment with
# required reviewers, using a separate `AZURE_STATIC_WEB_APPS_PROD_API_TOKEN`
# secret).
#
# Quality gates run in `validate`:
#   - prettier --check (frontend src/**)
#   - eslint .
#   - npm audit --omit=dev --audit-level=high (frontend prod deps)
#   - npm audit --audit-level=moderate (api, all deps)
#   - frontend unit + SWA-config-invariant tests (vitest)
#   - api unit tests (vitest)
#   - frontend build (astro)
#   - api build (tsc)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Stage 1 — Validate. All quality gates. Must pass before any deploy.
  # Runs on every event (PRs, push-to-main, workflow_dispatch).
  # ─────────────────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    name: Validate (lint, audit, tests, build)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Security audit (frontend prod deps, high+)
        run: npm run audit

      - name: Frontend tests (vitest, includes SWA config invariants)
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Install API deps
        working-directory: api
        run: npm ci --include=dev

      - name: Security audit (api, moderate+)
        working-directory: api
        run: npm audit --audit-level=moderate

      - name: API tests (vitest)
        working-directory: api
        run: npm test

      - name: Build API
        working-directory: api
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2a — PR preview deploy. SWA per-PR preview environment on the
  # DEV SWA. Only runs on PRs and only after validate is green.
  # ─────────────────────────────────────────────────────────────────────
  preview_dev_deploy:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy PR preview (dev SWA)
    outputs:
      preview_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (preview, dev SWA)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # AZURE_STATIC_WEB_APPS_API_TOKEN is the DEV SWA's deploy token.
          # Renaming the secret would be a larger op (repo-settings change);
          # documenting via comment for now.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          api_build_command: "npm ci --include=dev && npm test && npm run build"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2b — E2E against PR preview. Gates merge.
  # Diagnostic curl step always prints the redirect chain so a failure
  # is self-diagnosing without re-running.
  # ─────────────────────────────────────────────────────────────────────
  e2e_preview_dev:
    if: github.event_name == 'pull_request'
    needs: preview_dev_deploy
    runs-on: ubuntu-latest
    name: E2E (PR preview, dev SWA)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Wait for SWA readiness (poll homepage until 200, max 5min)
        env:
          E2E_BASE_URL: ${{ needs.preview_dev_deploy.outputs.preview_url }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::error::SWA action did not return a preview URL — cannot wait"
            exit 1
          fi
          deadline=$(($(date +%s) + 300))
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            code=$(curl -sLo /dev/null -w "%{http_code}" --max-time 10 "$E2E_BASE_URL/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$E2E_BASE_URL ready (200) after $attempts attempt(s)"
              break
            fi
            now=$(date +%s)
            if [ "$now" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for $E2E_BASE_URL (last code: $code)"
              exit 1
            fi
            echo "  attempt $attempts: $code, retrying in 5s..."
            sleep 5
          done
      - name: Diagnostic — auth login redirect chain
        env:
          E2E_BASE_URL: ${{ needs.preview_dev_deploy.outputs.preview_url }}
        run: |
          echo "::group::HEAD $E2E_BASE_URL/.auth/login/github (3 hops)"
          curl -sIL --max-redirs 3 -o /dev/null -w "url_effective=%{url_effective}\nhttp_code=%{http_code}\nredirect_url=%{redirect_url}\n" "$E2E_BASE_URL/.auth/login/github" || true
          echo "::endgroup::"
          echo "::group::Single-hop Location header"
          curl -sI "$E2E_BASE_URL/.auth/login/github" | grep -i '^location:' || echo "(no Location header)"
          echo "::endgroup::"
      - name: Run E2E suite against preview (with retry)
        env:
          E2E_BASE_URL: ${{ needs.preview_dev_deploy.outputs.preview_url }}
          # Preview envs don't inherit OAuth secrets; the auth-flow test
          # soft-skips when SWA auth-loop is detected. Leaving
          # E2E_AUTH_REQUIRED unset for the same reason.
        run: |
          # Up to 3 attempts, 30s between. Catches transient cold-start /
          # network blips without hiding real regressions (3 consecutive
          # failures still fail the job).
          for attempt in 1 2 3; do
            echo "::group::E2E attempt $attempt/3"
            if npm run test:e2e; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "E2E attempt $attempt failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "::error::E2E failed after 3 attempts"
          exit 1

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2.5 — Apply Bicep to the dev resource group. Idempotent — Bicep
  # is declarative, re-running with no diff is a no-op. Runs BEFORE
  # dev_deploy so any new app settings, container schemas, etc. are in
  # place before the app code that depends on them goes live.
  #
  # Auth: OIDC against the user-assigned managed identity (`codepals-dev-mi`)
  # which has a federated credential for `repo:rmjoia/codepalsio:ref:refs/
  # heads/main` and the Contributor role on the dev RG (granted by
  # main.bicep itself — bootstrap requires the FIRST apply to come from a
  # human Owner via infra/Initialize-Infra.ps1; after that CI takes over).
  #
  # GitHub vars required:
  #   AZURE_CLIENT_ID_DEV       — MI client id (Bicep output: managedIdentityClientId)
  #   AZURE_TENANT_ID           — AAD tenant
  #   AZURE_SUBSCRIPTION_ID     — subscription id
  # See infra/README.md for setup.
  # ─────────────────────────────────────────────────────────────────────
  infra_apply_dev:
    # workflow_dispatch is restricted to main because the federated
    # credential on codepals-dev-mi is bound to
    # `repo:rmjoia/codepalsio:ref:refs/heads/main` (Initialize-Infra.ps1).
    # Dispatching from a non-main ref would fail OIDC. Widen the
    # federated credential subject if branch infra-applies are ever
    # needed.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    name: Apply Bicep (dev)
    permissions:
      id-token: write # Required for azure/login OIDC.
      contents: read
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify required GitHub vars are set
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEV }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUB_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID_DEV"
          [ -z "$TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$SUB_ID" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions variable(s):$missing. See infra/README.md → 'GitHub Actions OIDC setup'."
            exit 1
          fi
          echo "OIDC vars present."
      - name: Azure login (OIDC, user-assigned MI)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (preview Bicep diff)
        run: |
          # RG name follows the Initialize-Infra.ps1 convention:
          # `${project}-${environment}-rg` → codepals-dev-rg.
          az deployment group what-if \
            --resource-group codepals-dev-rg \
            --template-file infra/main.bicep \
            --parameters environment=dev
      - name: Apply Bicep
        run: |
          az deployment group create \
            --resource-group codepals-dev-rg \
            --template-file infra/main.bicep \
            --parameters environment=dev \
            --name "github-actions-${{ github.run_id }}"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3a — Dev deploy. Targets the DEV SWA's production env, which
  # serves dev.codepals.io. Only after validate is green AND infra is
  # applied (so app settings, containers, etc. exist).
  # Triggered by push-to-main or workflow_dispatch on main.
  # NOT a deploy to actual production (codepals.io) — see header comment.
  # ─────────────────────────────────────────────────────────────────────
  dev_deploy:
    # Restricted to main: dev_deploy needs infra_apply_dev, which is
    # main-only (federated OIDC subject restriction). Allowing dispatch
    # from non-main here would just queue forever waiting on a skipped
    # dependency.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [validate, infra_apply_dev]
    runs-on: ubuntu-latest
    name: Deploy dev (dev.codepals.io)
    environment:
      name: dev
      url: https://dev.codepals.io
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy (dev SWA production env)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          api_build_command: "npm ci --include=dev && npm test && npm run build"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3b — Post-deploy E2E against dev.codepals.io. Alarms on
  # regression. Strict mode (E2E_AUTH_REQUIRED=1) — dev has GitHub OAuth
  # configured, so the full auth-flow chain must reach GitHub.
  # ─────────────────────────────────────────────────────────────────────
  e2e_dev:
    # Same main-only restriction as dev_deploy (its only dependency).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: dev_deploy
    runs-on: ubuntu-latest
    name: E2E (dev.codepals.io)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Wait for SWA readiness (poll homepage until 200, max 5min)
        run: |
          deadline=$(($(date +%s) + 300))
          attempts=0
          while true; do
            attempts=$((attempts + 1))
            code=$(curl -sLo /dev/null -w "%{http_code}" --max-time 10 https://dev.codepals.io/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://dev.codepals.io/ ready (200) after $attempts attempt(s)"
              break
            fi
            now=$(date +%s)
            if [ "$now" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for https://dev.codepals.io/ (last code: $code)"
              exit 1
            fi
            echo "  attempt $attempts: $code, retrying in 5s..."
            sleep 5
          done
      - name: Diagnostic — auth login redirect chain
        run: |
          echo "::group::HEAD https://dev.codepals.io/.auth/login/github (3 hops)"
          curl -sIL --max-redirs 3 -o /dev/null -w "url_effective=%{url_effective}\nhttp_code=%{http_code}\nredirect_url=%{redirect_url}\n" "https://dev.codepals.io/.auth/login/github" || true
          echo "::endgroup::"
          echo "::group::Single-hop Location header"
          curl -sI "https://dev.codepals.io/.auth/login/github" | grep -i '^location:' || echo "(no Location header)"
          echo "::endgroup::"
      - name: Run E2E suite against dev (with retry)
        env:
          E2E_BASE_URL: https://dev.codepals.io
          E2E_AUTH_REQUIRED: '1'
        run: |
          # Up to 3 attempts, 30s between. Catches transient cold-start /
          # network blips without hiding real regressions (3 consecutive
          # failures still fail the job and red-flag the deploy).
          for attempt in 1 2 3; do
            echo "::group::E2E attempt $attempt/3"
            if npm run test:e2e; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "E2E attempt $attempt failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "::error::E2E failed against dev.codepals.io after 3 attempts"
          exit 1
